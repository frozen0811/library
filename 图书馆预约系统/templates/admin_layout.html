<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>后台管理 - {% block admin_title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('admin_reservations') }}">后台管理系统</a>
            <ul class="navbar-nav">
                <li class="nav-item"><span class="nav-link">管理员: {{ session.username }}</span></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">返回主页</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('logout') }}">退出登录</a></li>
            </ul>
        </div>
    </nav>
    <div class="admin-wrapper">
        <aside class="sidebar">
            <ul class="sidebar-nav">
                <li class="sidebar-item {% if request.endpoint == 'admin_reservations' %}active{% endif %}">
                    <a href="{{ url_for('admin_reservations') }}">预约管理</a>
                </li>
                <li class="sidebar-item {% if request.endpoint == 'admin_accounts' %}active{% endif %}">
                    <a href="{{ url_for('admin_accounts') }}">账号管理</a>
                </li>
            </ul>
        </aside>
        <main class="admin-content">
            {% block admin_content %}{% endblock %}
        </main>
    </div>
    {% block admin_scripts %}{% endblock %}
</body>
</html>
